include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - third_party/**
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # Browser-only tests (`flutter test --platform chrome test/web`): the
    # analyzer resolves the native side of the conditional storage imports.
    - test/web/**

linter:
  rules:
    avoid_print: true
    prefer_final_locals: true
    unawaited_futures: true
