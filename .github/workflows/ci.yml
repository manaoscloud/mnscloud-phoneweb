name: CI

on:
  pull_request:
  push:
    branches:
      - main


# Read-only token: analysis, tests and builds publish nothing.
permissions:
  contents: read

jobs:
  flutter:
    name: Flutter Analyze And Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test


  sonarcloud:
    # SonarQube Cloud CI analysis (Dart is not covered by automatic analysis); shared and pinned in
    # mnscloud-runtime-kit. Skipped with a notice while SONAR_TOKEN is not available.
    uses: manaoscloud/mnscloud-runtime-kit/.github/workflows/sonarcloud-dart.yml@main
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    with:
      exclusions: "third_party/**"
