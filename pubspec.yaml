name: mnscloud_phoneweb
description: Public standalone Flutter WebRTC softphone for SIP over secure WebSocket providers.
publish_to: "none"
version: 0.1.50

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_contacts: ^2.0.2
  flutter_secure_storage: ^11.0.0
  flutter_webrtc: ^1.6.0
  go_router: ^17.5.0
  permission_handler: ^13.0.1
  shared_preferences: ^2.5.3
  sip_ua:
    path: third_party/sip_ua
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
